<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貓咪小屋</title>
<style>
  /* 深色遊戲畫面:場景是主角,控制列收在下方。強調色沿用水族箱的金黃。 */
  :root{--bg:#0f1a26;--panel:#16283b;--line:#2c4a70;--fg:#eaf2ff;--muted:#9db3cc;--accent:#ffc940;--btn:#2a5a8f;color-scheme:dark}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;margin:0;padding-inline:16px;padding-block:16px 32px}
  .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  h1{font-size:20px;margin:0;font-weight:700}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  canvas{display:block;width:100%;height:auto;touch-action:pan-y;cursor:pointer}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row .lab{color:var(--muted);font-size:13px;min-width:44px}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--muted)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{background:var(--btn);border-color:var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px}
  .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
  .zoom{display:flex;align-items:center;gap:10px}
  .zoom input{flex:1;min-width:0;accent-color:var(--accent)}
  .zoom span{font-size:13px;color:var(--muted)}
  #info,.hint{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>


<div class="wrap">
  <h1>貓咪小屋</h1>
  <div class="stage"><canvas id="stage" width="840" height="560" aria-label="貓咪場景,點擊地面讓貓走過去"></canvas></div>
  <div class="zoom"><span>拉近</span><input id="dist" type="range" min="0" max="100" value="100" aria-label="鏡頭距離"><span>拉遠</span></div>
  <div id="info"></div>
  <div class="row"><span class="lab">場景</span><span id="scenes" class="row"></span></div>
  <div class="row"><span class="lab">花色</span><span id="coats" class="row"></span></div>
  <div class="row"><button id="auto" class="on">自動漫遊:開</button></div>
  <div class="hint">點擊地面,貓會走過去。滑桿、滾輪或兩指縮放。拉到最近,可以看清楚貓的全貌。目前只有室內場景。</div>
</div>
<script src="game.js?v=aa40f3b7"></script>

</body>
</html>
